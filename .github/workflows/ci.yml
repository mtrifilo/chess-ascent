# Checks every pull request and every push to main. Each job runs the same
# commands that CLAUDE.md ("How to run things", "Continuous integration")
# gives for running them locally.
#
# Tool versions come from the repository: backend/global.json (the .NET SDK),
# the packageManager field of frontend/package.json (Bun) and
# frontend/.node-version (Node.js). global.json accepts later 11.0 feature
# bands, so CI installs the newest 11.0 SDK, which can be newer than a local
# one; when CI fails on code that has not changed, compare the SDK version the
# set-up step logged. Gitleaks is the one tool pinned here (secret-scanning),
# and each action is pinned to a commit, with its release in a comment; bump
# both together.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# The workflow token can read the repository and nothing else, whatever the
# repository's default token setting is. No job needs more, and no job uses a
# secret. Pull requests from forks get a read-only token and no secrets from
# GitHub in any case, because the trigger is pull_request and not
# pull_request_target.
permissions:
  contents: read

# A new push to a pull request cancels the run for its previous head, which
# nobody reads any more. Runs on main are never cancelled: each gets a group
# of its own commit, so every commit on main keeps a result of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Telemetry off for the .NET CLI, the test platform (Microsoft.Testing.Platform)
  # and Next.js. The front-end scripts already set NEXT_TELEMETRY_DISABLED;
  # setting it here as well covers any Next.js command run outside them.
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  TESTINGPLATFORM_TELEMETRY_OPTOUT: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  backend:
    name: Back end
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only this job caches the NuGet packages folder. It restores every
      # project and the tools, so the cache it saves is complete; a job that
      # restored less and saved first would leave packages out of it until
      # the lock files next change.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json
          cache: true
          cache-dependency-path: |
            backend/**/packages.lock.json
            backend/dotnet-tools.json

      # Locked mode: see RestorePackagesWithLockFile in Directory.Build.props.
      # Restore also runs NuGet's audit of every package, transitive ones
      # included, and Directory.Build.props makes a known vulnerability, or
      # (in CI) failing to download the vulnerability data, an error, so this
      # step is the back end's dependency-advisory check.
      - name: Restore
        run: dotnet restore --locked-mode

      # Locked mode only checks lock files that exist: for a project without
      # one, restore writes a new one and succeeds.
      - name: Fail if a project has no committed lock file
        run: |
          changes="$(git status --porcelain -- '*packages.lock.json')"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::A packages.lock.json is missing from the commit. Run dotnet restore in backend/ and commit the lock files."
            exit 1
          fi

      - name: Restore tools
        run: dotnet tool restore

      # Directory.Build.props sets TreatWarningsAsErrors, so any compiler,
      # analyzer or code-style warning fails this step.
      - name: Build
        run: dotnet build

      - name: Check formatting
        run: dotnet format --verify-no-changes

      # The API tests start their own PostgreSQL container with
      # Testcontainers; the hosted Ubuntu runners have Docker.
      - name: Test
        run: dotnet test

      # dotnet ef runs the API's start-up code in the Development environment
      # unless told otherwise, so it reads the connection string from
      # appsettings.Development.json. Checking for model changes never opens
      # a connection, so no database is needed.
      - name: Check for model changes without a migration
        run: dotnet ef migrations has-pending-model-changes --project src/ChessAscent.Api

  # The slow tier of the rules tests takes minutes, so it runs once each
  # change lands on main rather than on every pull request, which runs the
  # normal tier with the rest of the tests.
  backend-slow-tests:
    name: Back end, slow rules tests
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json

      - name: Slow rules tests
        run: dotnet test --project tests/ChessAscent.Chess.Tests --explicit only --filter-trait "Category=Slow" --parallel all

  frontend:
    name: Front end
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      # Bun's package cache, keyed on the lockfile; the api-types and
      # end-to-end jobs use the same key.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

  # The committed OpenAPI document and the TypeScript types generated from it
  # must match what the C# code produces. The job regenerates both and fails
  # on any change to the tree.
  api-types:
    name: API types drift
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install front-end packages
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Regenerate the API document and types
        run: scripts/gen-api-types.sh

      # The whole tree, so the check holds whichever files the script
      # writes, and git status rather than git diff, so a generated file
      # missing from the commit (untracked) fails it too. Build output and
      # node_modules are git-ignored.
      - name: Fail if the tree differs from the commit
        run: |
          changes="$(git status --porcelain --untracked-files=all)"
          if [ -n "$changes" ]; then
            echo "$changes"
            git diff
            echo "::error::Regenerating the API contract changed the files listed above. Run scripts/gen-api-types.sh (or bun run api:types in frontend/) and commit what it changes."
            exit 1
          fi

  # The whole application through a browser: scripts/e2e.sh starts the
  # database, the API and the web app's development server, runs the
  # Playwright test in Chromium, and stops them. The computer opponent is the
  # API's first-legal-move stand-in, so no engine is installed.
  e2e:
    name: End-to-end
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: backend/global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Install front-end packages
        working-directory: frontend
        run: bun install --frozen-lockfile

      # The browser build that the installed Playwright names, downloaded
      # from Playwright's own servers, with the system libraries it needs from
      # Ubuntu's. It is not cached: Playwright's documentation says restoring
      # a cache takes about as long as the download.
      - name: Install Chromium
        working-directory: frontend
        run: bun run playwright install --with-deps --only-shell chromium

      - name: End-to-end test
        run: scripts/e2e.sh

      # The trace and screenshot of a failure. They hold nothing but what the
      # test typed and saw: its made-up account, and the pages and API
      # responses of its own game. No workflow reads an artifact back.
      - name: Keep the trace and screenshot of a failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # Gitleaks (MIT) scans every commit in the history of the commit under
  # test, not only the files as they stand, because a secret committed and
  # then deleted is still public. A finding fails the job. The log options
  # are Gitleaks' defaults with two changes: HEAD in place of --all, so a
  # secret pushed on one branch fails that branch's run and not everyone
  # else's, and --remerge-diff, so text typed into a merge commit while
  # resolving a conflict, which git log shows no diff for by default, is
  # scanned too. The rules are always Gitleaks' default set, passed in from
  # outside the checkout: Gitleaks would otherwise read a .gitleaks.toml
  # from the repository, so a pull request could switch the rules off. The
  # log, which anyone can read on a public repository, shows only
  # where each finding is: Gitleaks' verbose output would print the text
  # around a redacted secret, which can hold a second one. The binary comes
  # from the project's GitHub release and is checked against the SHA-256
  # below before it runs; a new version takes the linux_x64 line of that
  # release's checksums file.
  secret-scanning:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        working-directory: ${{ runner.temp }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" gitleaks

      # Each finding is printed as one line of JSON, so a file name cannot
      # start a line of its own and be read as a workflow command.
      - name: Scan the history for secrets
        run: |
          report="$RUNNER_TEMP/gitleaks.json"
          config="$RUNNER_TEMP/gitleaks.toml"
          printf '[extend]\nuseDefault = true\n' >"$config"
          status=0
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config "$config" \
            --log-opts="--full-history --diff-filter=tuxdb --remerge-diff HEAD" \
            --report-format json --report-path "$report" . || status=$?
          if [ "$status" -ne 0 ] && [ -s "$report" ]; then
            jq --compact-output '.[] | {RuleID, File, StartLine, Commit}' "$report"
          fi
          exit "$status"

  # The front end's packages are checked against the npm registry's advisory
  # database. Any advisory, at any severity, fails the job: the same rule as
  # the back end's packages, which the Restore step of the back-end job
  # audits.
  dependency-advisories:
    name: Dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      # bun audit reads bun.lock, so nothing needs installing first.
      - name: Audit front-end packages
        run: bun audit
