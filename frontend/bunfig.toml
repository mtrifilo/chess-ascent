# Bun reads this file for commands run in frontend/.

# Bun's anonymous crash reports stay off for everyone who clones the repo.
telemetry = false

[install]
# `bun add` writes exact versions, matching the repo's rule that every
# dependency is pinned.
exact = true

# `bun add`, `bun update` and any install that has to resolve a version pick
# only versions published at least three days (259200 seconds) ago, so a
# release that is pulled or found to be malicious soon after publication
# does not reach bun.lock. Three days matches the 72 hours in which npm
# lets an author unpublish a new package. An install from an unchanged
# bun.lock, as in CI, resolves nothing and is not affected.
minimumReleaseAge = 259200
